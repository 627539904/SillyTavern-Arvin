<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Live2D移动端测试</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
            background: #1a1a1a;
            color: white;
            overflow: hidden;
        }
        
        .test-info {
            position: fixed;
            top: 10px;
            left: 10px;
            z-index: 1000;
            background: rgba(0,0,0,0.8);
            padding: 10px;
            border-radius: 5px;
            font-size: 12px;
        }
        
        .test-button {
            position: fixed;
            top: 10px;
            right: 10px;
            z-index: 1000;
            background: #007bff;
            color: white;
            border: none;
            padding: 10px 15px;
            border-radius: 5px;
            cursor: pointer;
        }
        
        .test-button:hover {
            background: #0056b3;
        }
        
        #live2d-canvas {
            background: transparent;
            display: flex;
            height: 100vh;
            width: 100vw;
            z-index: 10;
            position: fixed;
            top: 0;
            left: 0;
            padding: 0;
            margin: 0;
            visibility: visible !important;
            opacity: 1 !important;
            touch-action: manipulation;
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            -khtml-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
            user-select: none;
        }
        
        #live2d-canvas canvas {
            width: 100% !important;
            height: 100% !important;
            object-fit: contain;
        }
        
        @media screen and (max-width: 450px) {
            #live2d-canvas {
                z-index: 15 !important;
            }
        }
        
        @supports (-webkit-touch-callout: none) {
            #live2d-canvas {
                height: 100vh !important;
                width: 100vw !important;
                position: fixed !important;
                top: 0 !important;
                left: 0 !important;
                -webkit-transform: translateZ(0);
                transform: translateZ(0);
            }
        }
    </style>
</head>
<body>
    <div class="test-info">
        <div>设备: <span id="device-info"></span></div>
        <div>屏幕: <span id="screen-info"></span></div>
        <div>视口: <span id="viewport-info"></span></div>
        <div>Canvas: <span id="canvas-info"></span></div>
    </div>
    
    <button class="test-button" onclick="toggleCanvas()">切换Canvas</button>
    
    <div id="live2d-canvas"></div>
    
    <script>
        // 显示设备信息
        function updateInfo() {
            document.getElementById('device-info').textContent = navigator.userAgent;
            document.getElementById('screen-info').textContent = `${screen.width}x${screen.height}`;
            document.getElementById('viewport-info').textContent = `${window.innerWidth}x${window.innerHeight}`;
            
            const canvas = document.getElementById('live2d-canvas');
            if (canvas) {
                const rect = canvas.getBoundingClientRect();
                document.getElementById('canvas-info').textContent = `${rect.width}x${rect.height}`;
            }
        }
        
        // 切换Canvas显示
        function toggleCanvas() {
            const canvas = document.getElementById('live2d-canvas');
            if (canvas.style.visibility === 'hidden') {
                canvas.style.visibility = 'visible';
                canvas.style.opacity = '1';
            } else {
                canvas.style.visibility = 'hidden';
                canvas.style.opacity = '0';
            }
            updateInfo();
        }
        
        // 创建测试Canvas
        function createTestCanvas() {
            const canvas = document.getElementById('live2d-canvas');
            const testCanvas = document.createElement('canvas');
            testCanvas.width = window.innerWidth;
            testCanvas.height = window.innerHeight;
            testCanvas.style.width = '100%';
            testCanvas.style.height = '100%';
            
            const ctx = testCanvas.getContext('2d');
            ctx.fillStyle = 'rgba(255, 0, 0, 0.3)';
            ctx.fillRect(0, 0, testCanvas.width, testCanvas.height);
            
            ctx.fillStyle = 'white';
            ctx.font = '24px Arial';
            ctx.textAlign = 'center';
            ctx.fillText('Live2D Canvas 测试区域', testCanvas.width / 2, testCanvas.height / 2);
            ctx.fillText('如果能看到这个红色区域，说明Canvas正常显示', testCanvas.width / 2, testCanvas.height / 2 + 40);
            
            canvas.appendChild(testCanvas);
        }
        
        // 窗口大小变化处理
        function handleResize() {
            const canvas = document.getElementById('live2d-canvas');
            const testCanvas = canvas.querySelector('canvas');
            if (testCanvas) {
                testCanvas.width = window.innerWidth;
                testCanvas.height = window.innerHeight;
                createTestCanvas();
            }
            updateInfo();
        }
        
        // 初始化
        window.addEventListener('load', () => {
            createTestCanvas();
            updateInfo();
            
            window.addEventListener('resize', handleResize);
            window.addEventListener('orientationchange', () => {
                setTimeout(handleResize, 100);
            });
        });
        
        // 定期更新信息
        setInterval(updateInfo, 1000);
    </script>
</body>
</html>
